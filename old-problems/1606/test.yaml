name: 1606. Find Servers That Handled Most Number of Requests

types:
  inputs:
    k: int
    arrival: std::vector<int>
    load: std::vector<int>
  output: std::vector<int>

solutions:
  cpp:
    function: busiestServers

test_cases:
  example_1:
    inputs:
      k: 3
      arrival: [1, 2, 3, 4, 5]
      load: [5, 2, 3, 3, 3]
    output: [1]

  example_2:
    inputs:
      k: 3
      arrival: [1, 2, 3, 4]
      load: [1, 2, 1, 2]
    output: [0]

  example_3:
    inputs:
      k: 3
      arrival: [1, 2, 3]
      load: [10, 12, 11]
    output: [0, 1, 2]
