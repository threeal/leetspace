name: 3364. Minimum Positive Sum Subarray

types:
  inputs:
    nums: std::vector<int>
    l: int
    r: int
  output: int

solutions:
  cpp:
    function: minimumSumSubarray

test_cases:
  example_1:
    inputs:
      nums: [3, -2, 1, 4]
      l: 2
      r: 3
    output: 1

  example_2:
    inputs:
      nums: [-2, 2, -3, 1]
      l: 2
      r: 3
    output: -1

  example_3:
    inputs:
      nums: [1, 2, 3, 4]
      l: 2
      r: 4
    output: 3
