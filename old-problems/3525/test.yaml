name: 3525. Find X Value of Array II

types:
  inputs:
    nums: std::vector<int>
    k: int
    queries: std::vector<std::vector<int>>
  output: std::vector<int>

solutions:
  cpp:
    function: resultArray

test_cases:
  example_1:
    inputs:
      nums: [1, 2, 3, 4, 5]
      k: 3
      queries: [[2, 2, 0, 2], [3, 3, 3, 0], [0, 1, 0, 1]]
    output: [2, 2, 2]

  example_2:
    inputs:
      nums: [1, 2, 4, 8, 16, 32]
      k: 4
      queries: [[0, 2, 0, 2], [0, 2, 0, 1]]
    output: [1, 0]

  example_3:
    inputs:
      nums: [1, 1, 2, 1, 1]
      k: 2
      queries: [[2, 1, 0, 1]]
    output: [5]
