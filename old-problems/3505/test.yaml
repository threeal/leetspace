name: 3505. Minimum Operations to Make Elements Within K Subarrays Equal

types:
  inputs:
    nums: std::vector<int>
    x: int
    k: int
  output: long long

solutions:
  cpp:
    function: minOperations

test_cases:
  example_1:
    inputs:
      nums: [5, -2, 1, 3, 7, 3, 6, 4, -1]
      x: 3
      k: 2
    output: 8

  example_2:
    inputs:
      nums: [9, -2, -2, -2, 1, 5]
      x: 2
      k: 2
    output: 3
