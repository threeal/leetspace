name: 3756. Concatenate Non-Zero Digits and Multiply by Sum II

types:
  inputs:
    s: std::string
    queries: std::vector<std::vector<int>>
  output: std::vector<int>

solutions:
  cpp:
    function: sumAndMultiply

test_cases:
  example_1:
    inputs:
      s: "10203004"
      queries: [[0,7],[1,3],[4,6]]
    output: [12340, 4, 9]

  example_2:
    inputs:
      s: "1000"
      queries: [[0,3],[1,1]]
    output: [1, 0]

  example_3:
    inputs:
      s: "9876543210"
      queries: [[0,9]]
    output: [444444137]
