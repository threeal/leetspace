name: 3532. Path Existence Queries in a Graph I

types:
  inputs:
    n: int
    nums: std::vector<int>
    maxDiff: int
    queries: std::vector<std::vector<int>>
  output: std::vector<bool>

solutions:
  cpp:
    function: pathExistenceQueries

test_cases:
  example_1:
    inputs:
      n: 2
      nums: [1, 3]
      maxDiff: 1
      queries: [[0, 0,], [0, 1]]
    output: [true, false]

  example_2:
    inputs:
      n: 4
      nums: [2, 5, 6, 8]
      maxDiff: 2
      queries: [[0, 1], [0, 2], [1, 3], [2, 3]]
    output: [false, false, true, true]
