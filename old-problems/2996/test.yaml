name: 2996. Smallest Missing Integer Greater Than Sequential Prefix Sum

types:
  inputs:
    nums: std::vector<int>
  output: int

solutions:
  cpp:
    function: missingInteger

test_cases:
  example_1:
    inputs:
      nums: [1, 2, 3, 2, 5]
    output: 6

  example_2:
    inputs:
      nums: [3, 4, 5, 1, 12, 14, 13]
    output: 15

  test_case_2:
    inputs:
      nums: [29, 30, 31, 32, 33, 34, 35, 36, 37]
    output: 297
