name: 3420. Count Non-Decreasing Subarrays After K Operations

types:
  inputs:
    nums: std::vector<int>
    k: int
  output: long long

solutions:
  cpp:
    function: countNonDecreasingSubarrays

test_cases:
  example_1:
    inputs:
      nums: [6, 3, 1, 2, 4, 4]
      k: 7
    output: 17

  example_2:
    inputs:
      nums: [6, 3, 1, 3, 6]
      k: 4
    output: 12
